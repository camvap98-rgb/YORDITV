<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YORDITV - Tu Plataforma Privada</title>
    
    <!-- SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            margin-top: 80px;
        }

        /* Encabezado adaptable */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: rgba(8, 8, 8, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #B8860B;
            box-shadow: 0 4px 10px rgba(184, 134, 11, 0.2);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(45deg, #FFD700, #FFA500, #FFF8DC, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* BARRA DE BÚSQUEDA */
        .search-container {
            flex-grow: 1;
            max-width: 400px;
            margin: 0 20px;
        }

        .search-bar {
            width: 100%;
            padding: 10px 15px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 25px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .search-bar:focus {
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        nav a {
            color: #d1d1d1;
            text-decoration: none;
            margin-left: 15px;
            font-size: 16px;
            transition: 0.3s;
            font-weight: 500;
        }

        nav a:hover {
            color: #FFD700;
            text-shadow: 0 0 15px #FFD700;
        }

        /* BANNER PRINCIPAL CON TRÁILER AUTOMÁTICO */
        .hero {
            min-height: 50vh;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 5%;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border-bottom: 2px solid #333;
            text-align: center;
        }

        .estreno-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #FFD700;
            color: #000;
            padding: 6px 12px;
            font-weight: bold;
            border-radius: 5px;
            font-size: 12px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            z-index: 10;
        }

        .hero h2 {
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            color: #FFD700;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .hero-trailer-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #FFD700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
            background: #000;
        }

        .hero-trailer-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
        }

        /* Secciones */
        .section-title {
            font-size: clamp(20px, 3vw, 28px);
            margin: 30px 5% 20px 5%;
            color: #FFD700;
            border-left: 5px solid #FFD700;
            padding-left: 15px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        /* Grid adaptativo para Celular y Smart TV */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 0 5% 30px 5%;
        }

        @media (min-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 30px;
            }
            .logo { font-size: 36px; }
            nav a { font-size: 18px; margin-left: 25px; }
        }

        .card {
            background-color: #121212;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222;
            transition: 0.3s ease-in-out;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .card:hover, .card:focus {
            transform: translateY(-8px) scale(1.04);
            border: 2px solid #FFD700;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.5);
            outline: none;
        }

        .card-content {
            aspect-ratio: 2 / 3;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            overflow: hidden;
        }

        .card-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-title {
            padding: 12px 10px;
            font-size: 14px;
            text-align: center;
            color: #fff;
            font-weight: bold;
            background: linear-gradient(180deg, rgba(18,18,18,0) 0%, rgba(18,18,18,0.9) 80%);
            position: absolute;
            bottom: 0;
            width: 100%;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
        }

        /* REPRODUCTOR FLOTANTE ADAPTABLE */
        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 10px;
        }

        .player-container {
            width: 95%;
            max-width: 960px;
            background: #000;
            border: 2px solid #FFD700;
            border-radius: 12px;
            overflow: visible;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            position: relative;
        }

        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
            background: #000;
            border-radius: 10px 10px 0 0;
            overflow: hidden;
        }

        .video-box iframe, .video-box video {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* BOTÓN X DE CIERRE */
        .close-btn {
            position: absolute;
            top: -45px;
            right: 0;
            color: #FFD700;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            z-index: 2100;
            transition: all 0.2s ease;
            background: #e50914;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #FFD700;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
        }

        .close-btn:hover {
            color: #FFFFFF;
            background: #ff2a2a;
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        .movie-info-title {
            padding: 12px;
            color: #FFD700;
            font-size: 18px;
            text-align: center;
            background: #111;
            font-weight: bold;
            border-radius: 0 0 10px 10px;
        }
    </style>
</head>
<body>

    <!-- Menú Superior con Buscador -->
    <header>
        <div class="logo">YORDITV</div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-bar" placeholder="Buscar películas, series, comiquitas..." onkeyup="filtrarContenido()">
        </div>
        <nav>
            <a href="#accion">Acción</a>
            <a href="#comedia">Comedia</a>
            <a href="#terror">Terror</a>
            <a href="#series">Series</a>
            <a href="#comiquitas">Comiquitas</a>
        </nav>
    </header>

    <!-- BANNER PRINCIPAL CON TRÁILER DE ESTRENO AUTOMÁTICO -->
    <div class="hero">
        <span class="estreno-tag">🔥 GRAN ESTRENO EXCLUSIVO</span>
        <h2>Tráiler Oficial</h2>
        <div class="hero-trailer-container">
            <iframe src="https://www.youtube.com/embed/pqLSLoDkZWE?autoplay=1&mute=1&loop=1&playlist=pqLSLoDkZWE" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
    </div>

    <!-- SECCIÓN ACCIÓN -->
    <h2 class="section-title" id="accion">Películas de Acción</h2>
    <div class="grid-container" id="grid-accion"></div>

    <!-- SECCIÓN COMEDIA -->
    <h2 class="section-title" id="comedia">Películas de Comedia</h2>
    <div class="grid-container" id="grid-comedia"></div>

    <!-- SECCIÓN TERROR -->
    <h2 class="section-title" id="terror">Películas de Terror</h2>
    <div class="grid-container" id="grid-terror"></div>

    <!-- SECCIÓN SERIES -->
    <h2 class="section-title" id="series">Series</h2>
    <div class="grid-container" id="grid-series"></div>

    <!-- SECCIÓN COMIQUITAS -->
    <h2 class="section-title" id="comiquitas">Comiquitas</h2>
    <div class="grid-container" id="grid-comiquitas"></div>

    <!-- REPRODUCTOR FLOTANTE CON BOTÓN X -->
    <div id="playerModal" class="player-modal">
        <div class="player-container">
            <span class="close-btn" onclick="cerrarReproductor()" title="Cerrar película">✕</span>
            <div id="videoBox" class="video-box"></div>
            <div id="movieTitle" class="movie-info-title">Cargando...</div>
        </div>
    </div>

    <script>
        // Configuración de Firebase con tus credenciales de 'yorditv-6575c'
        const firebaseConfig = {
            apiKey: "AIzaSyCDNPNMaB5b6NGD3TLa7uTRxz8S6E6O6iI",
            authDomain: "yorditv-6575c.firebaseapp.com",
            projectId: "yorditv-6575c",
            storageBucket: "yorditv-6575c.firebasestorage.app",
            messagingSenderId: "85744391218",
            appId: "1:85744391218:web:generated"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Cargar contenido automáticamente desde Firestore
        function cargarContenidoDesdeFirebase() {
            db.collection("peliculas").get().then((querySnapshot) => {
                querySnapshot.forEach((doc) => {
                    let pelicula = doc.data();
                    let titulo = pelicula.titulo || "Sin título";
                    let categoria = pelicula.categoria ? pelicula.categoria.toLowerCase().trim() : "accion";
                    let urlVideo = pelicula.urlVideo || "";

                    // Extraer ID de YouTube para la miniatura automática si no se provee imagen
                    let videoId = "";
                    if(urlVideo.includes("embed/")) {
                        videoId = urlVideo.split("embed/")[1].split("?")[0];
                    }
                    let imagenUrl = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;

                    // Buscar el contenedor según la categoría guardada en Firebase
                    let contenedor = document.getElementById(`grid-${categoria}`);
                    
                    if (contenedor) {
                        let card = document.createElement("div");
                        card.className = "card";
                        card.setAttribute("tabindex", "0");
                        card.onclick = function() { reproducirPelicula(titulo, urlVideo); };

                        card.innerHTML = `
                            <div class="card-content">
                                <img src="${imagenUrl}" alt="${titulo}">
                            </div>
                            <div class="card-title">${titulo}</div>
                        `;
                        contenedor.appendChild(card);
                    }
                });
            }).catch((error) => {
                console.error("Error al cargar las películas: ", error);
            });
        }

        // Ejecutar la carga al abrir la página
        window.onload = function() {
            cargarContenidoDesdeFirebase();
        };

        // Funciones del Reproductor
        function reproducirPelicula(titulo, urlVideo) {
            var modal = document.getElementById('playerModal');
            var videoBox = document.getElementById('videoBox');
            var movieTitle = document.getElementById('movieTitle');

            movieTitle.innerText = titulo;
            videoBox.innerHTML = '<iframe src="' + urlVideo + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="width:100%; height:100%; border:none;"></iframe>';
            modal.style.display = 'flex';
        }

        function cerrarReproductor() {
            var modal = document.getElementById('playerModal');
            var videoBox = document.getElementById('videoBox');
            videoBox.innerHTML = ''; 
            modal.style.display = 'none';
        }

        // Función de Búsqueda Dinámica
        function filtrarContenido() {
            var input = document.getElementById('searchInput').value.toLowerCase();
            var cards = document.querySelectorAll('.card');

            cards.forEach(function(card) {
                var title = card.querySelector('.card-title').innerText.toLowerCase();
                if (title.includes(input)) {
                    card.style.display = "";
                } else {
                    card.style.display = "none";
                }
            });
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                cerrarReproductor();
            }
        });
    </script>
</body>
</html>
