<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YORDITV - Tu Plataforma Privada</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            margin-top: 80px;
        }

        /* Encabezado */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(8, 8, 8, 0.95);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #B8860B;
            box-shadow: 0 4px 10px rgba(184, 134, 11, 0.2);
        }

        .logo {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(45deg, #FFD700, #FFA500, #FFF8DC, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav a {
            color: #d1d1d1;
            text-decoration: none;
            margin-left: 25px;
            font-size: 18px;
            transition: 0.3s;
            font-weight: 500;
        }

        nav a:hover {
            color: #FFD700;
            text-shadow: 0 0 15px #FFD700;
        }

        /* BANNER PRINCIPAL */
        .hero {
            height: 60vh;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border-bottom: 2px solid #333;
            text-align: center;
        }

        .estreno-tag {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #FFD700;
            color: #000;
            padding: 6px 15px;
            font-weight: bold;
            border-radius: 5px;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .hero h2 {
            font-size: 2.5rem;
            color: #FFD700;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Secciones */
        .section-title {
            font-size: 30px;
            margin: 50px 40px 25px 40px;
            color: #FFD700;
            border-left: 6px solid #FFD700;
            padding-left: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
            padding: 0 40px 50px 40px;
        }

        .card {
            background-color: #121212;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222;
            transition: 0.4s ease-in-out;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .card:hover {
            transform: translateY(-12px) scale(1.05);
            border: 2px solid #FFD700;
            box-shadow: 0 15px 30px rgba(255, 215, 0, 0.5);
        }

        .card-content {
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            overflow: hidden;
        }

        .card-content img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-title {
            padding: 15px;
            font-size: 16px;
            text-align: center;
            color: #fff;
            font-weight: bold;
            background: linear-gradient(180deg, rgba(18,18,18,0) 0%, rgba(18,18,18,1) 80%);
            position: absolute;
            bottom: 0;
            width: 100%;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* REPRODUCTOR FLOTANTE */
        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .player-container {
            width: 90%;
            max-width: 900px;
            background: #000;
            border: 2px solid #FFD700;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            position: relative;
        }

        .video-box {
            width: 100%;
            height: 480px;
            position: relative;
            background: #000;
        }

        .video-box iframe, .video-box video {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #FFD700;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            z-index: 2100;
            transition: 0.2s;
        }

        .close-btn:hover {
            color: #FFF;
            transform: scale(1.2);
        }

        .movie-info-title {
            padding: 15px;
            color: #FFD700;
            font-size: 22px;
            text-align: center;
            background: #111;
        }
    </style>
</head>
<body>

    <!-- Menú Superior -->
    <header>
        <div class="logo">YORDITV</div>
        <nav>
            <a href="#peliculas">Películas</a>
            <a href="#series">Series</a>
            <a href="#comiquitas">Comiquitas</a>
        </nav>
    </header>

    <!-- BANNER PRINCIPAL -->
    <div class="hero">
        <span class="estreno-tag">🔥 BIENVENIDO A YORDITV</span>
        <h2>Catálogo Privado de Streaming</h2>
        <p style="color: #aaa;">Selecciona una película de la lista para empezar a reproducir.</p>
    </div>

    <!-- SECCIÓN PELÍCULAS -->
    <h2 class="section-title" id="peliculas">Catálogo de Películas</h2>
    <div class="grid-container" id="pelisGrid">

        <!-- Película 1 -->
        <div class="card" onclick="reproducirPelicula('Película 1', 'https://www.youtube.com/embed/xEiLU9LeMnA?si=NE06sYwYGa5iK0NB')">
            <div class="card-content">
                <img src="https://img.youtube.com/vi/xEiLU9LeMnA/hqdefault.jpg" alt="Película 1">
            </div>
            <div class="card-title">Película 1</div>
        </div>

    </div>

    <!-- REPRODUCTOR FLOTANTE EN YORDITV -->
    <div id="playerModal" class="player-modal">
        <span class="close-btn" onclick="cerrarReproductor()">&times; X</span>
        <div class="player-container">
            <div id="videoBox" class="video-box"></div>
            <div id="movieTitle" class="movie-info-title">Cargando...</div>
        </div>
    </div>

    <script>
        function reproducirPelicula(titulo, urlVideo) {
            var modal = document.getElementById('playerModal');
            var videoBox = document.getElementById('videoBox');
            var movieTitle = document.getElementById('movieTitle');

            movieTitle.innerText = titulo;

            if (urlVideo.endsWith('.mp4')) {
                videoBox.innerHTML = '<video controls autoplay style="width:100%; height:100%; background:#000;"><source src="' + urlVideo + '" type="video/mp4">Tu navegador no soporta este video.</video>';
            } else {
                videoBox.innerHTML = '<iframe src="' + urlVideo + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="width:100%; height:100%; border:none;"></iframe>';
            }
            
            modal.style.display = 'flex';
        }

        function cerrarReproductor() {
            var modal = document.getElementById('playerModal');
            var videoBox = document.getElementById('videoBox');
            videoBox.innerHTML = ''; 
            modal.style.display = 'none';
        }
    </script>

</body>
</html>
