<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YordiTV - Prueba de Video</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #e50914; /* Color estilo streaming / YordiTV */
      margin-bottom: 20px;
    }

    .player-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
      height: 0;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
    }

    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <h1>YordiTV - Módulo de Prueba</h1>

  <div class="player-container">
    <iframe 
      src="https://www.youtube.com/embed/xEiLU9LeMnA?si=pdgHWX_q-BvbSOoh" 
      title="YouTube video player" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      referrerpolicy="strict-origin-when-cross-origin" 
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
