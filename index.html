<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YORDITV - Panel Central y Notificaciones</title>
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("JvXR-QlA-Pg3w4iU9");
        })();
    </script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-start p-6">

    <div class="w-full max-w-4xl bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
        <header class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-black text-red-600 tracking-wider">YORDITV - PANEL CENTRAL</h1>
            <button onclick="simularNuevaCuenta()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-lg transition duration-200">
                Simular Nueva Cuenta / Pago
            </button>
        </header>

        <!-- Panel Central de Cuentas -->
        <section>
            <h2 class="text-lg font-semibold mb-3 text-gray-300">Cuentas Registradas y Pagos</h2>
            <div id="panel-central-cuentas" class="space-y-2 max-h-96 overflow-y-auto pr-2">
                <!-- Se cargan dinámicamente -->
            </div>
        </section>
    </div>

    <script>
        // --- FUNCIONES DEL PANEL Y NOTIFICACIONES ---

        function inicializarPanelCentral() {
            try {
                const cuentasRegistradas = JSON.parse(localStorage.getItem('yorditv_cuentas')) || [];
                const panelCentral = document.getElementById('panel-central-cuentas');
                
                if (!panelCentral) return;

                panelCentral.innerHTML = '';

                if (cuentasRegistradas.length === 0) {
                    panelCentral.innerHTML = '<p class="text-gray-400 p-4 text-center">No hay cuentas registradas actualmente en el panel.</p>';
                    return;
                }

                cuentasRegistradas.forEach((cuenta) => {
                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between p-4 bg-gray-900 rounded-lg border border-gray-700';
                    item.innerHTML = `
                        <div>
                            <p class="font-bold text-white text-lg">${cuenta.nombre || 'Usuario sin nombre'}</p>
                            <p class="text-sm text-gray-400">${cuenta.email || cuenta.telefono || 'Sin contacto'}</p>
                        </div>
                        <span class="px-3 py-1 text-xs font-semibold rounded-full ${cuenta.estado === 'activo' ? 'bg-green-600 text-white' : 'bg-yellow-600 text-white'}">
                            ${cuenta.estado || 'Pendiente'}
                        </span>
                    `;
                    panelCentral.appendChild(item);
                });

            } catch (error) {
                console.error("Error al cargar el panel central:", error);
            }
        }

        function enviarNotificacionAlerta(titulo, mensaje) {
            if (typeof emailjs === 'undefined') {
                console.error("EmailJS no está cargado correctamente.");
                return;
            }

            const templateParams = {
                title: titulo,
                message: mensaje,
                time: new Date().toLocaleString()
            };

            emailjs.send('service_i08v5zk', 'template_bxrn83g', templateParams)
                .then(function(response) {
                    console.log("NOTIFICACIÓN ENVIADA EXITOSAMENTE:", response.status, response.text);
                }, function(error) {
                    console.error("Fallo al enviar la notificación:", error);
                });
        }

        function simularNuevaCuenta() {
            let cuentas = JSON.parse(localStorage.getItem('yorditv_cuentas')) || [];
            
            const nuevaCuenta = {
                nombre: "Usuario de Prueba " + (cuentas.length + 1),
                email: "cliente" + (cuentas.length + 1) + "@gmail.com",
                estado: "Pendiente"
            };

            cuentas.push(nuevaCuenta);
            localStorage.setItem('yorditv_cuentas', JSON.stringify(cuentas));

            // Actualizar interfaz visual
            inicializarPanelCentral();

            // Disparar la notificación por correo
            enviarNotificacionAlerta("Nuevo Registro / Pago en YORDITV", "Se ha registrado una nueva cuenta de: " + nuevaCuenta.nombre);
            
            alert("¡Cuenta agregada y notificación enviada al sistema!");
        }

        // Ejecutar al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            inicializarPanelCentral();
        });
    </script>
</body>
</html>
