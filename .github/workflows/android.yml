name: Generar APK de YORDITV

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar herramientas
        uses: actions/checkout@v4
        with:
          node-version: '20'

      - name: Forzar Node 20 y compilar Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap init --manifest=https://yorditv-mz4s.vercel.app/manifest.json --directory=android-app --skip=androidManifest
          cd android-app
          bubblewrap build

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-app/app/build/outputs/apk/release/
