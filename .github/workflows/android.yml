name: Generar APK de YORDITV

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        run: |
          git clone https://github.com/${{ github.repository }}.git .

      - name: Instalar Java, Android SDK y Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          
          # Instalar herramientas de Bubblewrap globalmente sin preguntas
          npm install -g @bubblewrap/cli
          
          # Construir usando una carpeta de trabajo limpia
          mkdir android-app && cd android-app
          
          # Forzar la creación no interactiva con los datos de tu Vercel
          bubblewrap init --manifest=https://yorditv-mz4s.vercel.app/manifest.json --skip=androidManifest
          
          # Compilar el APK de una vez
          bubblewrap build

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-app/app/build/outputs/apk/release/
