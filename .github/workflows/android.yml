name: Generar APK de YORDITV

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar y compilar directo
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          npm install -g @bubblewrap/cli
          bubblewrap init --manifest=https://yorditv-mz4s.vercel.app/manifest.json --directory=android-app --skip=androidManifest
          cd android-app
          bubblewrap build

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-app/app/build/outputs/apk/release/
